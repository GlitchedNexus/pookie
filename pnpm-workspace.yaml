packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  # esbuild's platform binary installer is required by Vite, Vitest, and tsup.
  esbuild: true
  # Tailwind uses Parcel's native watcher for incremental development builds.
  "@parcel/watcher": true

catalog:
  "@arethetypeswrong/cli": ^0.18.5
  "@tailwindcss/cli": ^4.3.3
  "@tailwindcss/vite": ^4.3.3
  "@testing-library/jest-dom": ^7.0.1
  "@testing-library/react": ^16.3.3
  "@testing-library/user-event": ^14.6.7
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@typescript/native": "npm:typescript@^7.0.2"
  "@vitejs/plugin-react": ^6.0.5
  "@vitest/coverage-v8": ^5.0.0
  concurrently: ^10.0.5
  jsdom: ^30.0.1
  publint: ^0.3.24
  react: ^19.3.0
  react-dom: ^19.3.0
  tailwindcss: ^4.3.3
  tsup: ^8.5.1
  # TypeScript 7 has no programmatic API yet. Tooling imports this compatibility
  # package while @typescript/native supplies the TypeScript 7 `tsc` executable.
  typescript: "npm:@typescript/typescript6@^6.0.2"
  vite: ^8.3.0
  vitest: ^5.0.0

minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.10.10"
  - "@turbo/darwin-arm64@2.10.10"
  - "@turbo/linux-64@2.10.10"
  - "@turbo/linux-arm64@2.10.10"
  - "@turbo/windows-64@2.10.10"
  - "@turbo/windows-arm64@2.10.10"
  - turbo@2.10.10
  - concurrently@10.0.5
